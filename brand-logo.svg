<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <linearGradient id="gradTopRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="50%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="gradMidRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="60%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gradBotRibbon" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4e4e4e"/>
      <stop offset="50%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gradEdgeDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Outer Arc Top -->
    <path d="M 170 140 C 230 80 370 80 430 160 C 440 175 425 195 405 195 C 360 140 250 140 195 180 L 170 140 Z" fill="url(#gradTopRibbon)"/>
    
    <!-- Middle Arc Top -->
    <path d="M 170 195 C 220 145 340 145 390 205 C 400 218 385 235 365 235 C 330 195 240 195 195 225 L 170 195 Z" fill="url(#gradMidRibbon)"/>
    
    <!-- Inner Arc Top -->
    <path d="M 170 245 C 210 205 310 205 350 255 C 360 268 345 280 330 280 C 300 245 230 245 195 270 L 170 245 Z" fill="url(#gradEdgeDark)"/>

    <!-- Top Vertical Struts -->
    <path d="M 330 280 L 330 380 L 290 380 L 290 280 Z" fill="url(#gradMidRibbon)"/>
    <path d="M 290 280 L 290 340 L 250 340 L 250 280 Z" fill="url(#gradTopRibbon)"/>
    <path d="M 250 280 L 250 310 L 210 310 L 210 280 Z" fill="url(#gradEdgeDark)"/>

    <!-- Outer Arc Bottom -->
    <path d="M 330 510 C 270 570 130 570 70 490 C 60 475 75 455 95 455 C 140 510 250 510 305 470 L 330 510 Z" fill="url(#gradBotRibbon)"/>

    <!-- Middle Arc Bottom -->
    <path d="M 330 455 C 280 505 160 505 110 445 C 100 432 115 415 135 415 C 170 455 260 455 305 425 L 330 455 Z" fill="url(#gradMidRibbon)"/>

    <!-- Inner Arc Bottom -->
    <path d="M 330 405 C 290 445 190 445 150 395 C 140 382 155 370 170 370 C 200 405 270 405 305 380 L 330 405 Z" fill="url(#gradEdgeDark)"/>

    <!-- Bottom Vertical Struts -->
    <path d="M 170 370 L 170 270 L 210 270 L 210 370 Z" fill="url(#gradMidRibbon)"/>
    <path d="M 210 370 L 210 310 L 250 310 L 250 370 Z" fill="url(#gradBotRibbon)"/>
    <path d="M 250 370 L 250 340 L 290 340 L 290 370 Z" fill="url(#gradEdgeDark)"/>
  </g>
</svg>
